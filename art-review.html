<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artwork review</title><style>body{font:15px Arial;background:#eef2e4;color:#2c3540;margin:20px}h1{font-size:23px}.assets{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.asset{background:white;padding:10px;border-radius:15px;text-align:center}.asset img{height:130px;width:100%;object-fit:contain}.asset p{margin:8px 0 0}.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:25px}.scenes svg{width:100%;height:auto;border-radius:15px}h2{font-size:18px}</style><h1>Realistic game artwork</h1><nav><a href="#art-cat">Story props</a> · <a href="#scenes">Numeracy scenes</a> · <a href="#reading">Reading scenes</a></nav><div class="assets" id="assets"></div><h2>Numeracy scenes</h2><div class="scenes" id="scenes"></div><h2>Reading scenes</h2><div class="scenes" id="reading"></div><script type="module">import{realisticPropNames}from'./realistic-props.mjs';import{lollipopArt}from'./lollipop-art.mjs';import{storyPicture}from'./story-pictures.mjs';document.querySelector('#assets').innerHTML=realisticPropNames.map(name=>`<div class="asset" id="art-${name}"><img src="assets3d/${name}.png" alt="${name}"><p>${name}</p></div>`).join('');document.querySelector('#scenes').innerHTML=['traffic','birds','dogs','trees','bikes','nomsa','robot','fruit','search','plates','coin','share'].map(id=>`<div>${lollipopArt(id)}<p>${id}</p></div>`).join('');document.querySelector('#reading').innerHTML=[...Array(6)].map((_,i)=>storyPicture(0,i)).join('')+[...Array(6)].map((_,i)=>storyPicture(1,i)).join('');</script></html>
